<!DOCTYPE html>

<head>

<style>

  #overlay .big { font-size: 26px; letter-spacing: 3px; }

<body>
<div id="wrap">
  <div id="topbar"><span><b>ASCII-FPS v4</b></span><span id="fps">…</span><span id="pos"></span><span id="phase"></span></div>
  <div id="screen">
    <canvas id="cv"></canvas>
    <canvas id="mini"></canvas>
    <div id="scan"></div>

      <div class="big">ASCII-FPS v4</div><br>
      <div><b>CLICK PARA JUGAR</b></div><br>
      <div>WASD + mouse · SHIFT correr · N cambia la hora · H congela/reanuda el tiempo</div>
      <div>M minimapa · F scanlines · -/= tamaño del texto</div>
    </div></div>
  </div>
</div>
<script>
"use strict";
// ============================================================
//  UTILIDADES
// ============================================================
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function hash(x, y) {
  let h = (Math.floor(x) * 374761393 + Math.floor(y) * 668265263) | 0;
  h = (h ^ (h >> 13)) | 0; h = Math.imul(h, 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function mix(o, a, b, t) { o[0] = a[0] + (b[0] - a[0]) * t; o[1] = a[1] + (b[1] - a[1]) * t; o[2] = a[2] + (b[2] - a[2]) * t; }

// ============================================================
//  MAPA
//  '.' libre · 'B' bosque (borde) · 'H','W','D' casa/ventana/puerta
//  'K' torre del reloj · 'h' seto · '~' agua
// ============================================================
const MW = 32, MH = 22;
const grid = [], fgrid = [], hid = [];
for (let y = 0; y < MH; y++) {
  const r = [], f = [], i = [];
  for (let x = 0; x < MW; x++) {
    r.push((x === 0 || y === 0 || x === MW - 1 || y === MH - 1) ? "B" : ".");
    f.push("grass"); i.push(-1);
  }
  grid.push(r); fgrid.push(f); hid.push(i);
}
const HOUSES = [
  { x: 3,  y: 3, w: 6, h: 4, wall: [238,224,190], roof: [196,62,46],  trim: [236,232,220], shut: [72,112,150] },
  { x: 13, y: 4, w: 6, h: 4, wall: [168,200,226], roof: [74,84,118],  trim: [240,240,244], shut: [60,88,140] },
  { x: 22, y: 3, w: 6, h: 5, wall: [236,178,150], roof: [44,122,108], trim: [250,244,232], shut: [150,72,50] },
];
function house(id) {
  const H = HOUSES[id], hx = H.x, hy = H.y, w = H.w, h = H.h;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { grid[hy + y][hx + x] = "H"; hid[hy + y][hx + x] = id; }
  const mid = hx + (w >> 1);
  for (const wx of [hx + 1, hx + w - 2]) { grid[hy][wx] = "W"; grid[hy + h - 1][wx] = "W"; }
  const wys = h >= 5 ? [hy + 1, hy + h - 2] : [hy + 1];
  for (const wy of wys) { grid[wy][hx] = "W"; grid[wy][hx + w - 1] = "W"; }
  grid[hy + h - 1][mid] = "D";
}
house(0); house(1); house(2);
const TX0 = 15, TY0 = 4;                       // torre del reloj: 2x2 sobre la casa central
for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) grid[TY0 + y][TX0 + x] = "K";

for (let x = 13; x <= 20; x++) for (let y = 8; y <= 11; y++) fgrid[y][x] = "plaza";
function pathV(x, y0, y1) { for (let y = y0; y <= y1; y++) if (grid[y][x] === ".") fgrid[y][x] = "path"; }
function pathH(y, x0, x1) { for (let x = x0; x <= x1; x++) if (grid[y][x] === ".") fgrid[y][x] = "path"; }
pathV(10, 1, 20); pathH(12, 10, 21); pathV(21, 12, 15);
pathH(7, 6, 10); pathV(25, 8, 9); pathH(9, 21, 25); pathH(10, 10, 12);
for (let x = 2; x <= 8; x++) grid[8][x] = "h";
for (let x = 13; x <= 18; x++) grid[14][x] = "h";
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {     // lago
  const dx = (x - 24) / 5, dy = (y - 16.5) / 2.8;
  if (dx * dx + dy * dy < 1 && grid[y][x] === ".") grid[y][x] = "~";
}
for (let y = 15; y <= 17; y++) for (const x of [21, 22]) { grid[y][x] = "."; fgrid[y][x] = "dock"; }  // muelle

const TH = { H: 1.7, W: 1.7, D: 1.7, K: 3.6, h: 0.55, B: 2.15 };   // altura de cada tipo de muro
const SOLID = "BHWDKh~";
function tileAt(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 0 || iy < 0 || ix >= MW || iy >= MH) return "B";
  return grid[iy][ix];
}
const solidTile = (x, y) => SOLID.includes(tileAt(x, y));

// ============================================================
//  OBJETOS (sprites con silueta propia)
// ============================================================
const SPR = [], LAMPS = [];
function add(type, x, y, o) { SPR.push(Object.assign({ type, x, y, w: 1, h: 1, z: 0, r: 0, seed: SPR.length }, o || {})); }
[[1.5,10.5],[1.6,18.4],[6.5,1.6],[16.4,1.6],[29.5,1.5],[30.4,10.5],[5.5,19.5],[29.6,20.2],[14.5,19.4],
 [24.4,1.6],[28.5,8.6],[2.5,15.5],[11.6,2.6],[20.6,5.6],[1.6,6.4],[12.5,17.5],[8.4,16.5],[7.5,12.9],[19.6,1.7]]
  .forEach(([x, y]) => add("oak", x, y, { w: 1.7, h: 2.4, r: 0.32 }));
[[27.5,10.5],[29.5,12.5],[30.2,14.5],[3.5,12.5],[4.6,17.5],[8.5,19.5],[18.5,19.2],[26.5,20.4],[15.2,20.4],[2.4,20.2]]
  .forEach(([x, y]) => add("pine", x, y, { w: 1.3, h: 2.7, r: 0.28 }));
[[9.5,12.5],[11.5,7.5],[20.5,13.5],[12.5,16.5],[12.4,11.6],[21.6,8.5]]
  .forEach(([x, y]) => { add("lamp", x, y, { w: 0.55, h: 1.9, r: 0.13 }); LAMPS.push([x, y]); });
add("lamp", 22.5, 17.5, { w: 0.55, h: 1.5, r: 0.12 }); LAMPS.push([22.5, 17.5]);   // farol del muelle
add("fountain", 17, 10, { w: 1.9, h: 1.9, r: 0.92 });
add("bench", 14.6, 11.3, { w: 1.3, h: 0.65, r: 0.35 });
add("bench", 19.4, 11.3, { w: 1.3, h: 0.65, r: 0.35 });
[[3.7,7.55],[4.9,7.55],[23.5,8.6],[26.7,8.6],[12.4,7.6],[19.6,7.6],[9.2,3.6],[9.2,5.0]]
  .forEach(([x, y]) => add("bed", x, y, { w: 1.1, h: 0.4 }));
add("spire", 16, 5, { w: 2.1, h: 1.9, z: TH.K });

// ============================================================
//  RENDER: BUFFERS, CÁMARA
// ============================================================
let FONT = 12, boost = 0, LH = 12, DPR = 1;
let COLS = 200, ROWS = 60, cw = 7, PK = 80;
const FOVH = 74 * Math.PI / 180, TAN = Math.tan(FOVH / 2);
const screen = document.getElementById("screen");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let bgB, fgB, chB, HD, HS0, HS1, HN;

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  LH = Math.max(6, Math.round((FONT + boost) * DPR));
  const fontStr = LH + 'px "Cascadia Mono",Consolas,Menlo,monospace';
  ctx.font = fontStr;
  cw = ctx.measureText("M").width;
  const w = screen.clientWidth * DPR, h = screen.clientHeight * DPR;
  COLS = Math.max(60, Math.floor(w / cw));
  ROWS = Math.max(30, Math.floor(h / LH));
  cv.width = Math.ceil(COLS * cw); cv.height = ROWS * LH;
  cv.style.width = (cv.width / DPR) + "px"; cv.style.height = (cv.height / DPR) + "px";
  ctx.font = fontStr; ctx.textBaseline = "top";
  PK = (cv.width / 2) / TAN / LH;               // filas por unidad a distancia 1
  const N = COLS * ROWS;
  bgB = new Int32Array(N); fgB = new Int32Array(N); chB = new Uint16Array(N);
  HD = new Float32Array(COLS * 4); HS0 = new Int16Array(COLS * 4); HS1 = new Int16Array(COLS * 4); HN = new Uint8Array(COLS);
}
let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(fit, 120); });

let px = 9.6, py = 10.5, ang = -0.12, pitch = 0;
let keys = {}, locked = false;
let dayT = 0.12, autoDay = true;
const DAY_LEN = 150;

// ============================================================
//  ENTORNO: ciclo día/noche suave
// ============================================================
const SUN_AZ = -1.15, SDX = Math.cos(SUN_AZ), SDY = Math.sin(SUN_AZ);
const KEYS = [
  [0.00, [64,72,130],  [244,170,120], [1.00,0.82,0.72], 0.78],
  [0.07, [70,130,215], [200,224,240], [1.00,0.97,0.90], 1.00],
  [0.30, [58,130,214], [176,218,242], [1.00,1.00,0.97], 1.00],
  [0.41, [70,80,150],  [255,168,110], [1.00,0.78,0.62], 0.82],
  [0.47, [24,24,70],   [120,70,100],  [0.70,0.62,0.85], 0.58],
  [0.56, [8,14,40],    [22,36,72],    [0.55,0.63,1.00], 0.46],
  [0.88, [8,14,38],    [22,34,68],    [0.55,0.63,1.00], 0.44],
  [0.95, [30,36,90],   [130,100,120], [0.60,0.60,0.80], 0.50],
  [1.00, [64,72,130],  [244,170,120], [1.00,0.82,0.72], 0.78],
];
const ST = [0,0,0], SH = [0,0,0], TN = [1,1,1], FOGc = [0,0,0];
let L = 1, NF = 0, LR = 1, LG = 1, LB = 1, phaseName = "";
let sunEl = 0, moonEl = -1;
function envUpdate() {
  const t = ((dayT % 1) + 1) % 1;
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const f = clamp((t - a[0]) / (b[0] - a[0]), 0, 1), s = f * f * (3 - 2 * f);
  for (let k = 0; k < 3; k++) { ST[k] = lerp(a[1][k], b[1][k], s); SH[k] = lerp(a[2][k], b[2][k], s); TN[k] = lerp(a[3][k], b[3][k], s); FOGc[k] = SH[k]; }
  L = lerp(a[4], b[4], s); NF = clamp((0.72 - L) / 0.30, 0, 1);
  LR = L * TN[0]; LG = L * TN[1]; LB = L * TN[2];
  sunEl = t < 0.45 ? Math.sin(Math.PI * t / 0.45) : -1;
  moonEl = t >= 0.45 ? Math.sin(Math.PI * (t - 0.45) / 0.55) : -1;
  phaseName = t < 0.07 ? "🌅 AMANECER" : t < 0.36 ? "☀ DÍA" : t < 0.46 ? "🌇 ATARDECER" : t < 0.9 ? "🌙 NOCHE" : "🌅 AMANECER";
}
function lampGlow(wx, wy) {
  let g = 0;
  for (let k = 0; k < LAMPS.length; k++) {
    const dx = wx - LAMPS[k][0], dy = wy - LAMPS[k][1], d2 = dx * dx + dy * dy;
    if (d2 < 12) { const f = 1 - d2 / 12; g += f * f; }
  }
  return Math.min(1, g) * NF * 0.75;
}

// ============================================================
//  COLOR / CELDAS
// ============================================================
function pack(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g = g < 0 ? 0 : g > 255 ? 255 : g | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
  return ((r & 252) << 16) | ((g & 252) << 8) | (b & 252);
}
const hexCache = new Map();
function hex(c) { let s = hexCache.get(c); if (!s) { s = "#" + (c | 0x1000000).toString(16).slice(1); hexCache.set(c, s); } return s; }
const FOG0 = 7, FOG1 = 28;

// "superficie" actual (la rellenan las funciones de textura)
const sBg = [0,0,0], sFg = [0,0,0]; let sCh = 32, sEm = 0;
function S(bg, bm, fg, fm, ch, em) {
  sBg[0] = bg[0] * bm; sBg[1] = bg[1] * bm; sBg[2] = bg[2] * bm;
  sFg[0] = fg[0] * fm; sFg[1] = fg[1] * fm; sFg[2] = fg[2] * fm;
  sCh = ch.charCodeAt(0); sEm = em | 0;
}
function putCell(i, ch, bg, fg, fogF, shade, glow, em) {
  let r, g, b, r2, g2, b2;
  if (em) { r = bg[0]; g = bg[1]; b = bg[2]; r2 = fg[0]; g2 = fg[1]; b2 = fg[2]; }
  else {
    const sr = shade * LR, sg = shade * LG, sb = shade * LB;
    r = bg[0] * sr; g = bg[1] * sg; b = bg[2] * sb; r2 = fg[0] * sr; g2 = fg[1] * sg; b2 = fg[2] * sb;
    if (glow > 0) {
      const gr = glow * 230, gg = glow * 165, gb = glow * 70;
      r += gr; g += gg; b += gb; r2 += gr; g2 += gg; b2 += gb;
    }
  }
  if (fogF > 0) {
    r += (FOGc[0] - r) * fogF; g += (FOGc[1] - g) * fogF; b += (FOGc[2] - b) * fogF;
    r2 += (FOGc[0] - r2) * fogF; g2 += (FOGc[1] - g2) * fogF; b2 += (FOGc[2] - b2) * fogF;
  }
  bgB[i] = pack(r, g, b); fgB[i] = pack(r2, g2, b2); chB[i] = ch;
}

// ============================================================
//  MATERIALES
// ============================================================
const G1 = [78,172,82], G2 = [52,136,60], G_FG = [110,205,105];
const PATH = [186,150,94], PEB = [138,108,68];
const PLAZA_A = [204,204,212], PLAZA_B = [150,154,168], GROUT = [104,106,118];
const SAND = [230,210,154], SAND_D = [190,168,110];
const WAT_A = [30,112,190], WAT_B = [66,168,226];
const DOCK = [156,104,56], DOCK_D = [92,58,30];
const FLOWERS = [[236,84,110],[255,217,77],[250,250,250],[184,120,236]];
const LEAFS = [[58,158,66],[80,168,56],[46,140,74]], PINE = [30,104,62], BARK = [104,68,36];
const IRON = [52,52,62], STONE_F = [158,160,170], WOOD_B = [130,88,48], SOIL = [92,62,42];
const TOWER_ROOF = [176,64,52];

function floorPixel(i, wx, wy, d) {
  const ix = Math.floor(wx), iy = Math.floor(wy);
  let ft = "grass";
  if (ix >= 0 && iy >= 0 && ix < MW && iy < MH) ft = grid[iy][ix] === "~" ? "water" : fgrid[iy][ix];
  const fx = wx - ix, fy = wy - iy;
  const glow = NF > 0.05 ? lampGlow(wx, wy) : 0;
  const fogF = clamp((d - FOG0) / (FOG1 - FOG0), 0, 1);
  const n = hash(wx * 5, wy * 5);
  if (ft === "water") {
    const w1 = Math.sin(wx * 2.4 + T * 1.3) + Math.sin(wy * 3.3 - T + wx * 0.8) + Math.sin((wx + wy) * 1.7 + T * 0.7);
    const t = clamp((w1 + 3) / 6, 0, 1);
    mix(sBg, WAT_A, WAT_B, t);
    if (w1 > 1.5) { sFg[0] = 205; sFg[1] = 242; sFg[2] = 255; sCh = "~≈".charCodeAt(Math.floor(T * 2 + wx * 3) & 1); }
    else { mix(sFg, WAT_B, [190,235,255], t); sCh = t > 0.5 ? 126 : 45; }
    sEm = 0;
  } else if (ft === "plaza") {
    const chk = (ix + iy) & 1;
    if (fx < 0.07 || fy < 0.07) S(GROUT, 1, GROUT, 0.8, " ", 0);
    else S(chk ? PLAZA_A : PLAZA_B, 1, chk ? PLAZA_B : PLAZA_A, 1, n > 0.72 ? "." : " ", 0);
  } else if (ft === "dock") {
    const g = ((wy * 4) % 1) < 0.14;
    S(g ? DOCK_D : DOCK, 1, DOCK_D, 1, g ? "_" : "=", 0);
  } else if (ft === "path") {
    S(PATH, 0.9 + 0.2 * n, PEB, 1, n > 0.82 ? "." : (n > 0.62 ? "," : " "), 0);
  } else {
    const p = hash(wx * 1.1, wy * 1.1);
    mix(sBg, G2, G1, p);
    sFg[0] = G_FG[0]; sFg[1] = G_FG[1]; sFg[2] = G_FG[2];
    sCh = n > 0.8 ? 34 : n > 0.55 ? 44 : n > 0.38 ? 46 : 32; sEm = 0;
    if (d < 10 && hash(wx * 2.3, wy * 2.3) > 0.972) {
      const c = FLOWERS[Math.floor(hash(wx * 7, wy * 7) * 4)];
      sFg[0] = c[0]; sFg[1] = c[1]; sFg[2] = c[2]; sCh = 42;
    }
  }
  // orilla de arena
  if (ft !== "water" && ft !== "dock" && ix >= 17 && ix <= 30 && iy >= 12 && iy <= 20 && d < 20) {
    if (tileAt(wx + 0.3, wy) === "~" || tileAt(wx - 0.3, wy) === "~" || tileAt(wx, wy + 0.3) === "~" || tileAt(wx, wy - 0.3) === "~")
      S(SAND, 0.95 + 0.1 * n, SAND_D, 1, n > 0.6 ? "." : " ", 0);
  }
  putCell(i, sCh, sBg, sFg, fogF, 1, glow, 0);
}

// ---- cielo y colinas ----
let sunC = -999, sunR = 0, sunOn = false, moonC = -999, moonR = 0, moonOn = false;
function skyPixel(i, x, y, wa, hz) {
  const v = y / hz, vv = Math.pow(v, 1.5);
  let r = ST[0] + (SH[0] - ST[0]) * vv, g = ST[1] + (SH[1] - ST[1]) * vv, b = ST[2] + (SH[2] - ST[2]) * vv;
  let ch = 32, fr = r, fg = g, fb = b;
  if (NF > 0.25) {
    const hs = hash(Math.floor(wa * 170), y);
    if (hs > 0.986) { const tw = 0.6 + 0.4 * Math.sin(T * 2.5 + hs * 90); ch = hs > 0.997 ? 42 : 46; fr = fg = fb = 255 * tw * NF; }
  }
  if (sunOn) {
    const d = Math.hypot((x + 0.5 - sunC) * cw, (y + 0.5 - sunR) * LH), R = LH * 3;
    if (d < R) { r = 255; g = 238; b = 170; ch = 32; }
    else if (d < R * 4) { const f = Math.pow(1 - (d - R) / (R * 3), 2) * 0.55; r += (255 - r) * f; g += (220 - g) * f; b += (150 - b) * f; }
  }
  if (moonOn) {
    const d = Math.hypot((x + 0.5 - moonC) * cw, (y + 0.5 - moonR) * LH), R = LH * 2.3;
    if (d < R) { const c = hash(x * 0.7, y * 0.7) > 0.86 ? 0.86 : 1; r = 232 * c; g = 236 * c; b = 246 * c; ch = 32; }
    else if (d < R * 3.5) { const f = Math.pow(1 - (d - R) / (R * 2.5), 2) * 0.35; r += (200 - r) * f; g += (215 - g) * f; b += (245 - b) * f; }
  }
  const q = Math.sin(wa * 5.3 + T * 0.02) + 0.6 * Math.sin(wa * 11.7 + v * 4.1 - T * 0.04) + 0.5 * Math.sin(v * 9 + wa * 3.1);

}
function present() {
  for (let y = 0; y < ROWS; y++) {
    const row = y * COLS, yy = y * LH;
    let x = 0;
    while (x < COLS) {
      const c = bgB[row + x]; let x2 = x + 1;
      while (x2 < COLS && bgB[row + x2] === c) x2++;
      ctx.fillStyle = hex(c);
      const xa = Math.floor(x * cw), xb = Math.floor(x2 * cw) + (x2 < COLS ? 1 : 0);
      ctx.fillRect(xa, yy, xb - xa, LH);
      x = x2;
    }
    x = 0;
    while (x < COLS) {
      while (x < COLS && chB[row + x] === 32) x++;
      if (x >= COLS) break;
      const c = fgB[row + x]; let x2 = x, s = "", last = x;
      while (x2 < COLS) {
        const ch = chB[row + x2];
        if (ch === 32) { s += " "; x2++; continue; }
        if (fgB[row + x2] !== c) break;
        s += String.fromCharCode(ch); x2++; last = x2;
      }
      ctx.fillStyle = hex(c);
      ctx.fillText(s.slice(0, last - x), x * cw, yy);
      x = x2;
    }
  }
}

// ============================================================
//  MINIMAPA (sin texto: solo colores y formas)
// ============================================================
const mini = document.getElementById("mini"), mctx = mini.getContext("2d"), MS = 5;
mini.width = MW * MS; mini.height = MH * MS;
const mbase = document.createElement("canvas"); mbase.width = mini.width; mbase.height = mini.height;
(function buildMini() {
  const c = mbase.getContext("2d");
  const rgb = a => "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")";
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = grid[y][x], f = fgrid[y][x]; let col = "#2f6b3a";
    if (t === "B") col = "#0f3520";
    else if (t === "~") col = "#2f86c8";
    else if (t === "H" || t === "W" || t === "D") col = rgb(HOUSES[hid[y][x]].roof);
    else if (t === "K") col = "#d8c8a8";
    else if (t === "h") col = "#1c5a28";
    else if (f === "path") col = "#b08d57";
    else if (f === "plaza") col = "#9aa0ad";
    else if (f === "dock") col = "#8a5c30";
    c.fillStyle = col; c.fillRect(x * MS, y * MS, MS, MS);
  }
  for (const s of SPR) {
    const cx = s.x * MS, cy = s.y * MS;
    if (s.type === "oak" || s.type === "pine") { c.fillStyle = s.type === "oak" ? "#1f8a3a" : "#0e5a2c"; c.beginPath(); c.arc(cx, cy, 2.2, 0, 7); c.fill(); }
    else if (s.type === "lamp") { c.fillStyle = "#ffd75e"; c.fillRect(cx - 1, cy - 1, 2, 2); }
    else if (s.type === "fountain") { c.fillStyle = "#7fd4f2"; c.beginPath(); c.arc(cx, cy, 3.2, 0, 7); c.fill(); }
  }
})();
function drawMini() {
  if (mini.style.display === "none") return;
  mctx.drawImage(mbase, 0, 0);
  const cx = px * MS, cy = py * MS;
  mctx.fillStyle = "rgba(255,255,255,.22)";
  mctx.beginPath(); mctx.moveTo(cx, cy);
  mctx.lineTo(cx + Math.cos(ang - FOVH / 2) * 26, cy + Math.sin(ang - FOVH / 2) * 26);
  mctx.lineTo(cx + Math.cos(ang + FOVH / 2) * 26, cy + Math.sin(ang + FOVH / 2) * 26);
  mctx.closePath(); mctx.fill();
  mctx.fillStyle = "#ffffff"; mctx.beginPath();
  mctx.moveTo(cx + Math.cos(ang) * 4, cy + Math.sin(ang) * 4);
  mctx.lineTo(cx + Math.cos(ang + 2.5) * 3.2, cy + Math.sin(ang + 2.5) * 3.2);
  mctx.lineTo(cx + Math.cos(ang - 2.5) * 3.2, cy + Math.sin(ang - 2.5) * 3.2);
  mctx.closePath(); mctx.fill();
}

// ============================================================
//  MOVIMIENTO + LOOP
// ============================================================
function blocked(x, y) {
  const r = 0.2;
  if (solidTile(x - r, y - r) || solidTile(x + r, y - r) || solidTile(x - r, y + r) || solidTile(x + r, y + r)) return true;
  for (const s of SPR) if (s.r) { const dx = x - s.x, dy = y - s.y, rr = s.r + 0.16; if (dx * dx + dy * dy < rr * rr) return true; }
  return false;
}
const fpsEl = document.getElementById("fps"), posEl = document.getElementById("pos"), overlay = document.getElementById("overlay");
let last = performance.now(), frames = 0, ftime = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (autoDay) dayT = (dayT + dt / DAY_LEN) % 1;
  const sp = 3.4 * (keys["shift"] ? 1.8 : 1) * dt;
  const fw = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
  const st = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
  if (keys["arrowleft"]) ang -= 2.2 * dt;
  if (keys["arrowright"]) ang += 2.2 * dt;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const nx = px + (dx * fw - dy * st) * sp, ny = py + (dy * fw + dx * st) * sp;
  if (!blocked(nx, py)) px = nx;
  if (!blocked(px, ny)) py = ny;
  render(dt);
  frames++; ftime += dt;
  if (ftime >= 1.5) {
    const fps = frames / ftime;
    if (fps < 24 && boost < 6) { boost++; fit(); }
    else if (fps > 58 && boost > 0) { boost--; fit(); }
    fpsEl.textContent = Math.round(fps) + " fps · " + COLS + "x" + ROWS;
    posEl.textContent = "x" + px.toFixed(1) + " y" + py.toFixed(1);
    frames = 0; ftime = 0;
  }
  requestAnimationFrame(loop);
}

// ============================================================
//  INPUT
// ============================================================
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === "-") { FONT = Math.max(8, FONT - 1); fit(); }
  if (k === "=" || k === "+") { FONT = Math.min(18, FONT + 1); fit(); }
  if (k === "n") { dayT = (dayT + 0.12) % 1; autoDay = false; }
  if (k === "h") autoDay = !autoDay;
  if (k === "m") mini.style.display = mini.style.display === "none" ? "block" : "none";
  if (k === "f") { const s = document.getElementById("scan"); s.style.display = s.style.display === "block" ? "none" : "block"; }
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { keys = {}; });
overlay.addEventListener("click", () => { try { screen.requestPointerLock(); } catch (e) { overlay.classList.add("hidden"); } });
screen.addEventListener("click", () => { if (!locked) { try { screen.requestPointerLock(); } catch (e) {} } });
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === screen;
  overlay.classList.toggle("hidden", locked);
});
document.addEventListener("pointerlockerror", () => overlay.classList.add("hidden"));
document.addEventListener("mousemove", e => {
  if (locked || (e.buttons & 1)) { ang += e.movementX * 0.0026; pitch = clamp(pitch - e.movementY * 0.0012, -0.2, 0.2); }
});
setTimeout(() => { document.getElementById("toast").style.opacity = 0; }, 7000);

fit(); setTimeout(fit, 60);
requestAnimationFrame(loop);
</script>
</body>
</html>
